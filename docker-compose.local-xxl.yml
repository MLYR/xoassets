services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    platform: linux/amd64
    container_name: xxl-job-admin
    environment:
      PARAMS: >-
        --server.port=8080
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/xxl_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=${LOCAL_MYSQL_USERNAME:-root}
        --spring.datasource.password=${LOCAL_MYSQL_PASSWORD:-root}
        --xxl.job.accessToken=${XXL_JOB_ACCESS_TOKEN:-xoassets-xxl-job-local-token}
      TZ: Asia/Shanghai
    extra_hosts:
      # Linux Docker 需要该映射；Docker Desktop for Mac/Windows 已内置 host.docker.internal。
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
