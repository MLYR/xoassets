services:
  xoassets-mysql:
    image: mysql:8.0.46
    container_name: xoassets-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: xoassets
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - xoassets-mysql-data:/var/lib/mysql
      - ./xoassets-server/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./xoassets-server/src/main/resources/db/migration-market-calendar.sql:/docker-entrypoint-initdb.d/02-market-calendar.sql:ro
      - ./xoassets-server/src/main/resources/db/dev-data.sql:/docker-entrypoint-initdb.d/03-dev-data.sql:ro
      - ./xoassets-server/src/main/resources/db/xxl-job-init.sql:/docker-entrypoint-initdb.d/04-xxl-job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  xoassets-redis:
    image: redis:7.4.2
    container_name: xoassets-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-root}"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - xoassets-redis-data:/data

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.0
    platform: linux/amd64
    container_name: xxl-job-admin
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://xoassets-mysql:3306/xxl_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.accessToken=xoassets-xxl-job-local-token
      TZ: Asia/Shanghai
    depends_on:
      xoassets-mysql:
        condition: service_healthy
      xoassets-redis:
        condition: service_started
    ports:
      - "8081:8080"

  xoassets-server:
    build:
      context: ./xoassets-server
    container_name: xoassets-server
    volumes:
      - ./logs/xoassets-server:/app/logs
    environment:
      XOASSETS_DATASOURCE_URL: jdbc:mysql://xoassets-mysql:3306/xoassets?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      XOASSETS_DB_USERNAME: root
      XOASSETS_DB_PASSWORD: root
      XOASSETS_REDIS_HOST: xoassets-redis
      XOASSETS_REDIS_PORT: 6379
      XOASSETS_REDIS_PASSWORD: ${REDIS_PASSWORD:-root}
      XOASSETS_REDIS_DATABASE: 0
      XOASSETS_JWT_SECRET: xoassets-docker-local-secret-key-change-before-production
      XOASSETS_JWT_EXPIRE_MINUTES: 10080
      XXL_JOB_EXECUTOR_ENABLED: true
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
      XXL_JOB_ACCESS_TOKEN: xoassets-xxl-job-local-token
      XXL_JOB_EXECUTOR_APPNAME: xoassets-server
      XXL_JOB_EXECUTOR_ADDRESS: http://xoassets-server:9999/
      XXL_JOB_EXECUTOR_PORT: 9999
      TZ: Asia/Shanghai
    depends_on:
      xoassets-mysql:
        condition: service_healthy
      xoassets-redis:
        condition: service_started
      xxl-job-admin:
        condition: service_started
    ports:
      - "8080:8080"

  xoassets-web:
    build:
      context: ./xoassets-web
    container_name: xoassets-web
    depends_on:
      - xoassets-server
    ports:
      - "8088:80"

volumes:
  xoassets-mysql-data:
  xoassets-redis-data:
