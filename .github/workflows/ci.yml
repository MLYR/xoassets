name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Maven tests
        working-directory: xoassets-server
        run: mvn test

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xoassets-web/package-lock.json
      - name: Install dependencies
        working-directory: xoassets-web
        run: npm ci
      - name: Build Web
        working-directory: xoassets-web
        run: npm run build

  app:
    name: App Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xoassets-app/package-lock.json
      - name: Install dependencies
        working-directory: xoassets-app
        run: npm ci
      - name: Type check App
        working-directory: xoassets-app
        run: npm run type-check
