# 应用配置：数据库账号和 JWT 密钥可通过环境变量覆盖，避免把敏感信息写进源码。
server:
  port: 8080

spring:
  application:
    name: xoassets-server
  profiles:
    # 通过 XOASSETS_PROFILE 切换运行环境；默认 dev 便于本地开发直接看到完整日志。
    active: ${XOASSETS_PROFILE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${XOASSETS_DATASOURCE_URL:jdbc:mysql://localhost:3306/xoassets?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${XOASSETS_DB_USERNAME:root}
    password: ${XOASSETS_DB_PASSWORD:root}
    hikari:
      # 本地开发需要数据库连不上时尽快失败并打印原因，避免应用假启动。
      initialization-fail-timeout: 1
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${XOASSETS_REDIS_HOST:localhost}
      port: ${XOASSETS_REDIS_PORT:6379}
      password: ${XOASSETS_REDIS_PASSWORD:}
      database: ${XOASSETS_REDIS_DATABASE:0}
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    # logback-spring.xml 会按环境写入每日滚动日志，路径可由 XOASSETS_LOG_PATH 覆盖。
    path: ${XOASSETS_LOG_PATH:logs}

knife4j:
  enable: true
  setting:
    language: zh_cn

xoassets:
  jwt:
    # 本地开发默认密钥只用于启动，生产环境必须用环境变量覆盖。
    secret: ${XOASSETS_JWT_SECRET:xoassets-local-development-secret-key-must-be-replaced}
    expire-minutes: ${XOASSETS_JWT_EXPIRE_MINUTES:10080}
  quotes:
    # 行情定时刷新只处理已过期价格，任务失败不会影响主应用启动。
    refresh-fixed-delay-ms: ${XOASSETS_QUOTES_REFRESH_FIXED_DELAY_MS:900000}
    refresh-initial-delay-ms: ${XOASSETS_QUOTES_REFRESH_INITIAL_DELAY_MS:60000}
    fund-refresh-cron: ${XOASSETS_FUND_REFRESH_CRON:0 30 19 * * ?}
    fund-refresh-followup-cron: ${XOASSETS_FUND_REFRESH_FOLLOWUP_CRON:0 0,30 20-23 * * ?}
    # 晚间多次沉淀日级价格和用户投资快照，覆盖基金净值延迟更新场景。
    daily-aggregate-cron: ${XOASSETS_QUOTES_DAILY_AGGREGATE_CRON:0 25,55 19-22 * * ?}
    daily-aggregate-late-cron: ${XOASSETS_QUOTES_DAILY_AGGREGATE_LATE_CRON:0 25 23 * * ?}
    investment-snapshot-cron: ${XOASSETS_INVESTMENT_DAILY_SNAPSHOT_CRON:0 30 19 * * ?}
    investment-snapshot-followup-cron: ${XOASSETS_INVESTMENT_DAILY_SNAPSHOT_FOLLOWUP_CRON:0 0,30 20-23 * * ?}
  fund-confirm:
    # 基金金额买入待确认扫描，净值未入库时保持 PENDING_CONFIRM 等待下一轮。
    fixed-delay-ms: ${XOASSETS_FUND_CONFIRM_FIXED_DELAY_MS:1800000}
    initial-delay-ms: ${XOASSETS_FUND_CONFIRM_INITIAL_DELAY_MS:120000}
  snapshots:
    daily-cron: ${XOASSETS_SNAPSHOT_DAILY_CRON:0 50 23 * * ?}
  market-calendar:
    # 每年开年第一天补齐当年和下一年的基础市场日历，交易所特殊休市日以数据库记录为准。
    yearly-refresh-cron: ${XOASSETS_MARKET_CALENDAR_YEARLY_REFRESH_CRON:0 5 0 1 1 ?}
  logging:
    max-history: ${XOASSETS_LOG_MAX_HISTORY:30}
    total-size-cap: ${XOASSETS_LOG_TOTAL_SIZE_CAP:2GB}
---
spring:
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    # 仅 dev profile 通过 SLF4J 输出 MyBatis SQL，确保控制台和滚动日志文件都能记录。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
