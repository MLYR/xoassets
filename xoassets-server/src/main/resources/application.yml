# 应用配置：数据库账号和 JWT 密钥可通过环境变量覆盖，避免把敏感信息写进源码。
server:
  port: 8080

spring:
  application:
    name: xoassets-server
  profiles:
    # 通过 XOASSETS_PROFILE 切换运行环境；默认 dev 便于本地开发直接看到完整日志。
    active: ${XOASSETS_PROFILE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${XOASSETS_DATASOURCE_URL:jdbc:mysql://localhost:3306/xoassets?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${XOASSETS_DB_USERNAME:root}
    password: ${XOASSETS_DB_PASSWORD:root}
    hikari:
      # 本地开发需要数据库连不上时尽快失败并打印原因，避免应用假启动。
      initialization-fail-timeout: 1
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${XOASSETS_REDIS_HOST:localhost}
      port: ${XOASSETS_REDIS_PORT:6379}
      password: ${XOASSETS_REDIS_PASSWORD:}
      database: ${XOASSETS_REDIS_DATABASE:0}
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    # logback-spring.xml 会按环境写入每日滚动日志，路径可由 XOASSETS_LOG_PATH 覆盖。
    path: ${XOASSETS_LOG_PATH:logs}

knife4j:
  enable: true
  setting:
    language: zh_cn

xxl:
  job:
    admin:
      # 本地默认指向 Docker Compose 暴露的 XXL-JOB Admin，未启用执行器时不会连接。
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8081/xxl-job-admin}
    # 调度中心和执行器必须保持同一个 token；本地默认值只用于开发。
    accessToken: ${XXL_JOB_ACCESS_TOKEN:xoassets-xxl-job-local-token}
    executor:
      # 默认关闭，避免未启动 XXL-JOB Admin 时影响普通本地开发；Docker Compose 中会开启。
      enabled: ${XXL_JOB_EXECUTOR_ENABLED:true}
      appname: ${XXL_JOB_EXECUTOR_APPNAME:xoassets-server}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:10099}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:logs/xxl-job}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}
      timeout: ${XXL_JOB_EXECUTOR_TIMEOUT:3}

xoassets:
  jwt:
    # 本地开发默认密钥只用于启动，生产环境必须用环境变量覆盖。
    secret: ${XOASSETS_JWT_SECRET:xoassets-local-development-secret-key-must-be-replaced}
    expire-minutes: ${XOASSETS_JWT_EXPIRE_MINUTES:10080}
  logging:
    max-history: ${XOASSETS_LOG_MAX_HISTORY:30}
    total-size-cap: ${XOASSETS_LOG_TOTAL_SIZE_CAP:2GB}
---
spring:
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    # 仅 dev profile 通过 SLF4J 输出 MyBatis SQL，确保控制台和滚动日志文件都能记录。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
