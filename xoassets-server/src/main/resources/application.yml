# 应用配置：数据库账号和 JWT 密钥可通过环境变量覆盖，避免把敏感信息写进源码。
server:
  port: 8080

spring:
  application:
    name: xoassets-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xoassets?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # 本地开发需要数据库连不上时尽快失败并打印原因，避免应用假启动。
      initialization-fail-timeout: 1
      connection-timeout: 5000
      validation-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 本地开发输出 MyBatis SQL 和参数，便于联调时检查 user_id 隔离和余额变更。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  pattern:
    # 控制台日志包含时间、级别、线程、logger 和堆栈，便于直接在 IDE 里排查启动和接口异常。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n%wEx"
  level:
    root: info
    com.xoassets: debug
    com.xoassets.persistence.mapper: debug
    com.zaxxer.hikari: info
    org.mybatis: debug
    org.springframework.jdbc: debug

knife4j:
  enable: true
  setting:
    language: zh_cn

xoassets:
  jwt:
    # 本地开发默认密钥只用于启动，生产环境必须用环境变量覆盖。
    secret: ${XOASSETS_JWT_SECRET:xoassets-local-development-secret-key-must-be-replaced}
    expire-minutes: ${XOASSETS_JWT_EXPIRE_MINUTES:10080}
  quotes:
    # 行情定时刷新只处理已过期价格，任务失败不会影响主应用启动。
    refresh-fixed-delay-ms: ${XOASSETS_QUOTES_REFRESH_FIXED_DELAY_MS:300000}
    refresh-initial-delay-ms: ${XOASSETS_QUOTES_REFRESH_INITIAL_DELAY_MS:60000}
